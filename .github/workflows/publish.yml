name: Publish Cliffhold build

on:
  push:
    paths:
      - release.txt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
      - name: Fetch and unpack the build
        run: |
          URL=$(sed -n 's/^url=//p' release.txt | tr -d '\r')
          echo "Fetching the build named in release.txt"
          curl -L --fail -o /tmp/build.zip "$URL"
          rm -rf /tmp/build && mkdir -p /tmp/build
          unzip -o /tmp/build.zip -d /tmp/build
          cp -r /tmp/build/. .
      - name: Commit and push the build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to publish"
          else
            VER=$(sed -n 's/^version=//p' release.txt | tr -d '\r')
            git commit -m "Publish Cliffhold build ${VER:-unknown}"
            git push
          fi
